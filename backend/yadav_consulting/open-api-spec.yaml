openapi: 3.0.0
info:
  title: Blue Collar Jobs API
  version: 1.0.0
  description: API for managing blue collar job postings and applications
  contact:
    name: API Support
    email: support@example.com

servers:
  - url: http://localhost:3000
    description: Development
  - url: https://api.example.com
    description: Production

tags:
  - name: Jobs
    description: Job-related operations
  - name: Applications
    description: Application-related operations

paths:
  /jobs/query:
    get:
      summary: Query jobs with filters
      operationId: searchJobs
      tags: [Jobs]
      description: Search for jobs using filters and options via query parameters
      parameters:
        - name: location
          in: query
          schema:
            type: string
        - name: jobType
          in: query
          schema:
            type: string
        - name: experience
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: sort
          in: query
          schema:
            type: string
            example: "-createdAt"
      responses:
        '200':
          description: List of matched jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSearchResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /jobs/details/{job_id}:
    get:
      summary: Retrieve job information
      operationId: getJobDetails
      tags: [Jobs]
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /applications/submit:
    get:
      summary: Submit job application
      operationId: applyToJob
      tags: [Applications]
      description: Apply to a job using query parameters
      parameters:
        - name: job_id
          in: query
          required: true
          schema:
            type: string
        - name: full_name
          in: query
          required: true
          schema:
            type: string
        - name: email
          in: query
          required: true
          schema:
            type: string
        - name: phone_number
          in: query
          required: true
          schema:
            type: string
        - name: experience_years
          in: query
          schema:
            type: integer
        - name: skills
          in: query
          schema:
            type: string
            description: Comma-separated skills
        - name: resume_url
          in: query
          schema:
            type: string
            format: uri
        - name: cover_letter
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobApplicationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /applications/list:
    get:
      summary: List all job applications
      operationId: getAllApplications
      tags: [Applications]
      responses:
        '200':
          description: Applications fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationsListResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /applications/{application_id}:
      get:
        summary: Retrieve an application
        operationId: fetchApplicationById
        tags: [Applications]
        parameters:
          - name: application_id
            in: path
            required: true
            schema:
              type: string
        responses:
          '200':
            description: Application details retrieved
          '404':
            description: Application details not found
          '500':
            description: Internal error

components:
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: Internal error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    BaseResponse:
      type: object
      required: [id, ver, ets, params, responseCode]
      properties:
        id:
          type: string
        ver:
          type: string
          example: "1.0"
        ets:
          type: integer
          format: int64
        params:
          type: object
          properties:
            msgid:
              type: string
              format: uuid
            err:
              type: string
            errmsg:
              type: string
            status:
              type: string
              enum: [SUCCESSFUL, FAILED]
        responseCode:
          type: string
          enum: [OK, ERROR, INTERNAL_ERROR, NOT_FOUND]

    Job:
      type: object
      required: [jobId]
      properties:
        jobId:
          type: string
        title:
          type: string
        description:
          type: string
        company:
          type: string
        location:
          type: string
        jobType:
          type: string
        experience:
          type: string
        salary:
          type: object
        requirements:
          type: array
          items:
            type: string
        benefits:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        isActive:
          type: boolean
      additionalProperties: true

    Application:
      type: object
      required: [application_id, job_id, applicant]
      properties:
        application_id:
          type: string
        job_id:
          type: string
        applicant:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [submitted, under_review, accepted, rejected]
        submitted_on:
          type: string
          format: date-time
      additionalProperties: true

    JobApplicationRequest:
      type: object
      required: [applicant]
      properties:
        applicant:
          type: object
          required: [full_name, email, phone_number]
          properties:
            full_name:
              type: string
            email:
              type: string
              format: email
            phone_number:
              type: string
            experience_years:
              type: integer
            skills:
              type: array
              items:
                type: string
            resume_url:
              type: string
              format: uri
            cover_letter:
              type: string
          additionalProperties: true
      additionalProperties: true

    JobSearchResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            result:
              type: object
              properties:
                jobs:
                  type: array
                  items:
                    $ref: '#/components/schemas/Job'

    JobDetailResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            result:
              type: object
              properties:
                job:
                  $ref: '#/components/schemas/Job'

    JobApplicationResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            result:
              type: object
              properties:
                application:
                  type: object
                  properties:
                    application_id:
                      type: string
                    job_id:
                      type: string
                    status:
                      type: string
                      example: submitted
                    applied_at:
                      type: string
                      format: date-time

    ApplicationsListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            result:
              type: object
              properties:
                applications:
                  type: array
                  items:
                    $ref: '#/components/schemas/Application'

    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            result:
              type: object
              description: Error-specific info
              additionalProperties: true
